<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моя любовь</title>
<style>
  :root{
    --bg-1:#2b0f1a;
    --bg-2:#4a1626;
    --rose:#e8a4b8;
    --rose-bright:#ff6f91;
    --cream:#fbe9ee;
    --gold:#e8c07d;
    --ink:#2b0f1a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Georgia','Iowan Old Style',serif;
    background:radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1) 70%);
    color:var(--cream);
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100%;height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8vw 6vw;
    opacity:0;
    pointer-events:none;
    transform:scale(0.96);
    transition:opacity 0.7s ease, transform 0.7s ease;
  }
  .slide.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
  }
  .icon{
    width:clamp(72px,16vw,128px);
    height:clamp(72px,16vw,128px);
    margin-bottom:0.6em;
    animation:pulse 2.6s ease-in-out infinite;
    filter:drop-shadow(0 6px 24px rgba(255,111,145,0.45));
  }
  .icon svg{width:100%;height:100%;display:block;}
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  h1{
    font-size:clamp(1.8rem,6vw,3.2rem);
    font-weight:400;
    letter-spacing:0.01em;
    margin:0 0 0.3em 0;
    line-height:1.25;
    max-width:14ch;
    color:var(--cream);
  }
  .sub{
    font-size:clamp(1rem,2.6vw,1.2rem);
    color:var(--rose);
    margin-bottom:2.4em;
    font-style:italic;
  }
  .name{
    color:var(--gold);
    font-style:normal;
  }
  .row{
    display:flex;
    gap:1.4rem;
    position:relative;
    width:100%;
    max-width:480px;
    justify-content:center;
    align-items:center;
    flex-wrap:nowrap;
  }
  button{
    font-family:inherit;
    font-size:1.05rem;
    padding:0.9em 2.1em;
    border-radius:999px;
    border:none;
    cursor:pointer;
    background:linear-gradient(135deg,var(--rose-bright),#c84b6d);
    color:#fff;
    box-shadow:0 8px 24px rgba(255,111,145,0.35);
    transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    white-space:nowrap;
  }
  button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(255,111,145,0.5);
  }
  .ghost{
    background:transparent;
    border:1.5px solid rgba(251,233,238,0.5);
    color:var(--cream);
    box-shadow:none;
  }
  .ghost:hover{
    border-color:var(--gold);
    color:var(--gold);
  }
  #byeBtn{
    position:fixed;
    transition:left 0.18s ease, top 0.18s ease, transform 0.35s ease, opacity 0.35s ease;
    z-index:5;
  }
  .float-hearts span{
    position:absolute;
    bottom:-10%;
    display:block;
    opacity:0;
    animation:floatUp 6s linear infinite;
    color:var(--rose);
  }
  .float-hearts span svg{width:100%;height:100%;display:block;}
  @keyframes floatUp{
    0%{opacity:0; transform:translateY(0) translateX(0);}
    10%{opacity:0.8;}
    90%{opacity:0.5;}
    100%{opacity:0; transform:translateY(-110vh) translateX(var(--drift,20px));}
  }
  .final-icon{
    width:clamp(120px,26vw,220px);
    height:clamp(120px,26vw,220px);
    animation:beat 1.6s ease-in-out infinite;
    filter:drop-shadow(0 10px 40px rgba(255,111,145,0.6));
    margin-bottom:0.5em;
  }
  .final-icon svg{width:100%;height:100%;display:block;}
  @keyframes beat{
    0%,100%{transform:scale(1);}
    25%{transform:scale(1.1);}
    40%{transform:scale(0.98);}
    55%{transform:scale(1.07);}
  }
  .shake{
    animation:shake 0.5s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
</style>
</head>
<body>

<!-- SVG symbol defs: reusable line-art icons -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="icon-heart" viewBox="0 0 100 100">
      <path d="M50 86 C20 64 6 46 6 28 C6 12 18 2 32 2 C42 2 48 8 50 14 C52 8 58 2 68 2 C82 2 94 12 94 28 C94 46 80 64 50 86 Z"
        fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M50 86 C20 64 6 46 6 28 C6 12 18 2 32 2 C42 2 48 8 50 14 C52 8 58 2 68 2 C82 2 94 12 94 28 C94 46 80 64 50 86 Z"
        fill="currentColor" opacity="0.18"/>
    </symbol>

    <symbol id="icon-envelope" viewBox="0 0 100 100">
      <rect x="6" y="20" width="88" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <path d="M10 24 L50 56 L90 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 56 C55 52 68 45 73 42" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
      <path d="M50 56 C45 52 32 45 27 42" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
      <path d="M64 70 C68 64 62 60 58 63 C54 60 48 64 52 70 C54 73 58 76 58 76 C58 76 62 73 64 70 Z"
        fill="currentColor" opacity="0.85"/>
    </symbol>

    <symbol id="icon-thought" viewBox="0 0 100 100">
      <ellipse cx="54" cy="36" rx="38" ry="28" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <circle cx="24" cy="70" r="7" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="12" cy="86" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M54 22 C50 18 42 18 40 24 C38 30 44 32 48 30 C52 34 60 34 60 28 C60 24 56 22 54 22 Z"
        fill="currentColor" opacity="0.75"/>
    </symbol>

    <symbol id="icon-double-heart" viewBox="0 0 120 100">
      <path d="M44 84 C18 64 6 48 6 32 C6 18 16 9 28 9 C37 9 42 14 44 19 C46 14 51 9 60 9"
        fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
      <path d="M72 90 C38 64 22 42 22 22 C22 8 34 -2 50 -2 C62 -2 69 5 72 12 C75 5 82 -2 94 -2 C110 -2 122 8 122 22 C122 42 106 64 72 90 Z"
        transform="translate(-12,0)"
        fill="currentColor" opacity="0.9" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div class="float-hearts" id="floatHearts"></div>

<div id="app">

  <!-- SLIDE 0: Greeting -->
  <div class="slide active" id="slide0">
    <div class="icon" style="color:var(--rose-bright)"><svg><use href="#icon-heart"/></svg></div>
    <h1>Привет, моя любовь</h1>
    <div class="sub">останься со мной ещё немного?</div>
    <div class="row" id="row0">
      <button id="hiBtn" onclick="goTo('slide1')">Привет</button>
      <button id="byeBtn" class="ghost">Пока</button>
    </div>
  </div>

  <!-- SLIDE 1: Apology -->
  <div class="slide" id="slide1">
    <div class="icon" style="color:var(--gold)"><svg><use href="#icon-envelope"/></svg></div>
    <h1>Прости меня за всё.<br>Я тебя очень сильно люблю.</h1>
    <div class="sub">Моя <span class="name">Сабриночка</span></div>
    <div class="row">
      <button onclick="goTo('slide2')">Прощаю</button>
      <button onclick="goTo('slide2')">Прощаю</button>
    </div>
  </div>

  <!-- SLIDE 2: The twist question -->
  <div class="slide" id="slide2">
    <div class="icon" style="color:var(--rose)"><svg><use href="#icon-thought"/></svg></div>
    <h1 id="q2">Ты мне изменяешь?</h1>
    <div class="row">
      <button onclick="onYes()">Да</button>
      <button onclick="goTo('slide3')">Нет</button>
    </div>
  </div>

  <!-- SLIDE 3: Final -->
  <div class="slide" id="slide3">
    <div class="final-icon" style="color:var(--rose-bright)"><svg><use href="#icon-double-heart"/></svg></div>
    <h1>Жди меня.<br>Я скоро приду.</h1>
    <div class="sub">и мы проверим это</div>
  </div>

</div>

<script>
  // Floating background hearts (SVG)
  const floatContainer = document.getElementById('floatHearts');
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.innerHTML = '<svg viewBox="0 0 100 100"><use href="#icon-heart"/></svg>';
    const size = (14+Math.random()*20);
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.setProperty('--drift', (Math.random()*60-30)+'px');
    s.style.animationDelay = (Math.random()*6)+'s';
    s.style.animationDuration = (5+Math.random()*4)+'s';
    floatContainer.appendChild(s);
  }

  function goTo(id){
    document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function onYes(){
    const q = document.getElementById('q2');
    const original = q.innerHTML;
    q.innerHTML = 'Что? Как ты могла?';
    q.classList.add('shake');
    setTimeout(()=>{
      q.classList.remove('shake');
      q.innerHTML = original;
    }, 1800);
  }

  // The escaping "Пока" button
  const byeBtn = document.getElementById('byeBtn');
  const row0 = document.getElementById('row0');
  let scale = 1;
  let dodges = 0;
  const maxDodges = 9;

  function placeInitial(){
    const rect = row0.getBoundingClientRect();
    const bRect = byeBtn.getBoundingClientRect();
    byeBtn.style.left = (rect.right - bRect.width - 2) + 'px';
    byeBtn.style.top = (rect.top + (rect.height - bRect.height)/2) + 'px';
  }

  function dodge(){
    if(dodges >= maxDodges){
      byeBtn.style.opacity = '0';
      byeBtn.style.transform = 'scale(0)';
      byeBtn.style.pointerEvents = 'none';
      return;
    }
    dodges++;
    scale = Math.max(0.15, 1 - dodges*0.09);
    const vw = window.innerWidth, vh = window.innerHeight;
    const bw = byeBtn.offsetWidth, bh = byeBtn.offsetHeight;
    const margin = 20;
    const newLeft = margin + Math.random()*(vw - bw - margin*2);
    const newTop = margin + Math.random()*(vh - bh - margin*2);
    byeBtn.style.left = newLeft + 'px';
    byeBtn.style.top = newTop + 'px';
    byeBtn.style.transform = `scale(${scale})`;
    if(dodges >= maxDodges){
      setTimeout(()=>{
        byeBtn.style.opacity = '0';
        byeBtn.style.pointerEvents = 'none';
      }, 180);
    }
  }

  byeBtn.addEventListener('mouseenter', dodge);
  byeBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
  byeBtn.addEventListener('click', (e)=>{ e.preventDefault(); dodge(); });

  window.addEventListener('resize', ()=>{ if(dodges===0) placeInitial(); });
  window.addEventListener('load', placeInitial);
  setTimeout(placeInitial, 50);
</script>

</body>
</html>
